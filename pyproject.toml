[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-empleo"
version = "0.1.0"
description = "Encuentra vacantes con correo de postulación y deja borradores listos en Gmail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miguel Muñoz" }]
dependencies = ["PyYAML>=6", "requests>=2.31"]

[project.optional-dependencies]
local = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "anthropic>=0.40",
]
linkedin = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
buscador-empleo = "buscador_empleo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
